name: rebuild

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
    steps:
      - name: Start a build of the Cloudflare Worker
        if: ${{ env.CLOUDFLARE_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "$CLOUDFLARE_DEPLOY_HOOK"
